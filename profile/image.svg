<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; }
      .placeholder { fill: #f0f9f6; stroke: #0F6E56; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .plus { font-size: 22px; fill: #0F6E56; opacity: 0.4; text-anchor: middle; }
      .caption { font-size: 9px; fill: #0F6E56; opacity: 0.6; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="520" height="200" fill="none"/>

  <!-- ── reproducr hex (real logo via image) ── -->
  <!-- Flat-top hexagon at centre-left, width ~120 -->
  <image href="https://raw.githubusercontent.com/repro-stats/reproducr/main/man/figures/logo.svg"
         x="10" y="20" width="130" height="150"/>

  <!-- Connector line -->
  <line x1="145" y1="95" x2="185" y2="95"
        stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- ── Placeholder 1 ── -->
  <polygon points="220,35 258,57 258,102 220,124 182,102 182,57"
           class="placeholder"/>
  <text x="220" y="89" class="plus">+</text>
  <text x="220" y="140" class="caption">future package</text>

  <!-- Connector -->
  <line x1="258" y1="79" x2="295" y2="79"
        stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.35"/>

  <!-- ── Placeholder 2 ── -->
  <polygon points="330,35 368,57 368,102 330,124 292,102 292,57"
           class="placeholder"/>
  <text x="330" y="89" class="plus">+</text>
  <text x="330" y="140" class="caption">future package</text>

  <!-- Connector -->
  <line x1="368" y1="79" x2="405" y2="79"
        stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.25"/>

  <!-- ── Placeholder 3 ── -->
  <polygon points="440,35 478,57 478,102 440,124 402,102 402,57"
           class="placeholder"/>
  <text x="440" y="89" class="plus">+</text>
  <text x="440" y="140" class="caption">future package</text>

</svg>
